labels:
  platform: linux/arm64

# A `v*` tag builds the image and pushes :<version> to Zot. Nothing is deployed from here: Renovate
# proposes the new version in the server's config repo (oci-server-conf), and merging it deploys.
# No repo trust needed: the build runs in plugin-docker-buildx, which the Woodpecker server allows to
# run privileged by name, at any version (WOODPECKER_PLUGINS_PRIVILEGED), so the pin can be bumped
# here without touching the server.
# A manual run builds the same image(s) without pushing, to test the pipeline itself.
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  - name: build-push
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: tag
    settings: &build_push
      registry: reg.aclerici.me
      username:
        from_secret: tg_registry_user
      password:
        from_secret: tg_registry_password
      repo: reg.aclerici.me/telegram/mcp
      tags: ${CI_COMMIT_TAG##v}
      dockerfile: Containerfile
      context: .
      platforms: linux/arm64
      # The plugin adds created, revision, source and url itself.
      labels:
        - org.opencontainers.image.version=${CI_COMMIT_TAG##v}
      # A list setting, so its comma is escaped; cache_to is a plain string.
      cache_from: 'type=registry\,ref=reg.aclerici.me/telegram/mcp:buildcache'
      cache_to: type=registry,ref=reg.aclerici.me/telegram/mcp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  - name: build-push-test
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: manual
    settings:
      <<: *build_push
      tags: ci-test
      dry_run: true
